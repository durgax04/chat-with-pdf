name: Build and Deploy

on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
          run_install: true

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build app
        run: pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push docker image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/gigax01/pdfchatapp:$IMAGE_TAG .
          docker push $ECR_REGISTRY/gigax01/pdfchatapp:$IMAGE_TAG

      - name: Clone deployment repo, update tags and push tags
        env:
          PAT: ${{ secrets.PAT }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git clone https://github.com/durgax04/ops.git
          cd ops/pdfchatapp
          sed -i "s|image: .*$|image: ${ECR_REGISTRY}/gigax01/pdfchatapp:${IMAGE_TAG}|" deployment.yml
          git config user.name "Github Actions Bot"
          git config user.email "actions@github.com"
          git add deployment.yml
          git commit -m "Update pdfchatapp image to $IMAGE_TAG"
          git push https://${PAT}@github.com/durgax04/ops.git main

      - name: Update kubeconfig
        run: aws eks --region ap-south-1 update-kubeconfig --name pdfchatapp-cluster

      - name: Update Deployment image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: kubectl set image deployment/chatwithpdf chatwithpdf=$ECR_REGISTRY/gigax01/pdfchatapp:${{ github.sha }}
