name: Build and Deploy

on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::469511672970:role/github-actions-ecr-deploy-role
          role-session-name: GitHubActionsECRPush
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3           

      - name: Build and push docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/gigax01/pdfchatapp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clone GitOps Repository
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          git clone https://${PAT}@github.com/durgax04/ops.git

      - name: Update Kubernetes Manifest & Push
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
          PAT: ${{ secrets.PAT }}
        run: |
          cd ops/pdfchatapp
          sed -i "s|image: .*$|image: ${ECR_REGISTRY}/gigax01/pdfchatapp:${IMAGE_TAG}|" deployment.yml
          
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          git add deployment.yml
          git commit -m "Update pdfchatapp image to $IMAGE_TAG"

          git push https://${PAT}@github.com/durgax04/ops.git HEAD:main

      - name: Deployment Triggered
        run: |
          echo "Image pushed to ECR: ${{ secrets.ECR_REGISTRY }}/gigax01/pdfchatapp:${{ github.sha }}"
          echo "GitOps repository updated."
          echo "Argo CD will detect the change and deploy automatically."