name: Reusable Smoke Test

on:
  workflow_call:
    inputs:
      image_ref:
        required: true
        type: string
      role_to_assume:
        required: true
        type: string
      aws_region:
        required: false
        type: string
        default: "us-east-1"

permissions:
  id-token: write
  contents: read

jobs:
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          role-session-name: GitHubActionsSmokeTest
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull image
        run: docker pull "${{ inputs.image_ref }}"

      - name: Start container
        run: |
          docker run -d \
            --name smoke-app \
            -p 3000:3000 \
            -e NODE_ENV=production \
            "${{ inputs.image_ref }}"

      - name: Smoke test (/live and /ready)
        run: |
          echo "Waiting for container endpoints to respond with HTTP 200..."
          MAX_RETRIES=30
          RETRY_COUNT=0

          until [ $RETRY_COUNT -ge $MAX_RETRIES ]; do
            LIVE_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health/live || true)
            READY_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health/ready || true)

            echo "Attempt $((RETRY_COUNT+1))/$MAX_RETRIES -> /live: $LIVE_CODE, /ready: $READY_CODE"

            if [ "$LIVE_CODE" = "200" ] && [ "$READY_CODE" = "200" ]; then
              echo "Smoke tests passed!"
              exit 0
            fi

            RETRY_COUNT=$((RETRY_COUNT+1))
            sleep 2
          done

          echo "::error::Smoke test failed. Outputting container logs:"
          docker logs smoke-app
          exit 1

      - name: Cleanup container
        if: always()
        run: docker rm -f smoke-app || true