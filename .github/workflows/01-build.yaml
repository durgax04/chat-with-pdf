name: 01 - Build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::469511672970:role/github-actions-ecr-deploy-role
          role-session-name: GitHubActionsECRPush
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/gigax01/app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Emit image reference for downstream workflows
      - name: Write build metadata
        run: |
          mkdir -p meta
          echo "${{ github.sha }}" > meta/image-tag.txt
          echo "${{ steps.login-ecr.outputs.registry }}/gigax01/app:${{ github.sha }}" > meta/image-ref.txt

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: build-meta
          path: meta/
          retention-days: 7