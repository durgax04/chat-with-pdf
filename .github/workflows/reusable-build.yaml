name: Reusable Build

on:
  workflow_call:
    inputs:
      role_to_assume:
        required: true
        type: string
      aws_region:
        required: false
        type: string
        default: "us-east-1"
    outputs:
      image_tag:
        value: ${{ jobs.build.outputs.image_tag }}
      image_ref:
        value: ${{ jobs.build.outputs.image_ref }}

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-meta.outputs.image_tag }}
      image_ref: ${{ steps.set-meta.outputs.image_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          role-session-name: GitHubActionsECRPush
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/gigax01/app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set outputs
        id: set-meta
        run: |
          echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${{ steps.login-ecr.outputs.registry }}/gigax01/app:${{ github.sha }}" >> "$GITHUB_OUTPUT"